character=La clase equilibrado es muy completa y es la clase de personaje estándar.
bob-character-miner=La clase Minero tiene una mayor velocidad de extracción y puede fundir minerales a mano, pero se mueve más lentamente y tiene menos salud.
bob-character-fighter=La clase Luchador tiene una mayor velocidad de carrera y más salud, pero su inventario es más pequeño.
bob-character-builder=La clase Constructor tiene un mayor tamaño de inventario y velocidad de creación, pero se mueve más lentamente y tiene menos salud.

bob-character-balanced-2=La clase Equilibrado 2 es muy completa, con ligeras mejoras en salud, tamaño del inventario, alcance y velocidad de carrera.
bob-character-miner-2=La clase Minero 2 tiene una mayor velocidad de extracción, mayor capacidad de inventario y puede fundir minerales a mano.
bob-character-fighter-2=La clase Luchador tiene una mayor velocidad de carrera y más salud
bob-character-builder-2=La clase Constructor 2 tiene un mayor tamaño de inventario y velocidad de creación.

bob-character-engineer=La clase Ingeniero es una combinación de las clases Minero y Constructor. Tiene más espacio en el inventario, mayor alcance, mayor velocidad de minería y de fabricación, y puede fundir minerales a mano.
bob-character-prospector=La clase Prospector es una combinación de las clases Minero y Luchador. Tiene mayor velocidad de carrera, más salud, mayor velocidad de minería y puede fundir minerales a mano.


