bobmods-tech-colorupdate=Cambia los colores de los packs de ciencias para que coincidan con la progresión de las cintas
bobmods-burnerphase=Bloquea la tecnología no alimentada por quemadores detrás de la investigación. .\nAdvertencia:\nEsta configuración no está diseñada para funcionar con AAI Industry, que también añade mucha investigación en fase inicial. Las principales áreas de conflicto incluyen el hecho de que este mod considera la energía de vapor como algo que se interpone entre el quemador y la electricidad (véanse como ejemplos la máquina de ensamblaje y el taladro minero impulsados por vapor), mientras que AAI cambia la bomba costera para que requiera electricidad, y la caldera y la máquina de vapor son un método más avanzado para obtener electricidad después del generador eléctrico del quemador.\nEn algunas situaciones, el juego no se carga si esta opción está activada cuando se instala AAI Industry.

