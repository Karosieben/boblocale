[mod-setting-description]
bobmods-revamp-nuclear=Si está activado, está configuración cambiará el reactor nuclear 2 en un reactor de torio, y el reactor nuclear 3 en un reactor de deuterio, y reestructurará la investigación en consecuencia.
bobmods-revamp-old-oil=Si se activa, esta opción hará cambios en la cadena de producción de procesamiento de petróleo.\nTambién elimina las recetas de azufre base y ácido sulfúrico y añade un medio para obtener azufre y dióxido de azufre si se instala IMC.
bobmods-revamp-oil=Si se activa, esta opción hará cambios más realistas en la cadena de procesamiento de aceite.\nReemplaza la producción de gas de petróleo del procesamiento de petróleo por gas agrietado, que puede procesarse en gas de petróleo.\nElimina las recetas de azufre y ácido sulfúrico de juego base y añade sulfuro de hidrógeno a la receta de procesamiento de gases agrios si se instala MCI.\ntendrá prioridad sobre la revisión de aceite y azufre más antiguos.
bobmods-revamp-hardmode=Si se activa, este ajuste ampliará algunos de los procesos químicos simplificados para hacerlos más realistas.\nEsto afectará el dióxido de nitrógeno, el ácido nítrico, el ácido sulfúrico, el perclorado de litio, el cloruro de calcio, el carbonato de sodio, el óxido de cobalto y el gas de Petróleo gaseoso en las recetas de hirógeno.

